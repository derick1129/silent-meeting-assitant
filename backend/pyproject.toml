[project]
name = "silent-meeting-assistant"
version = "0.1.0"
description = "Multimodal Silent Meeting Assistant Companion"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python-headless>=4.10.0",
    "mediapipe>=0.10.14",
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "safetensors>=0.4.5",
    "av>=12.3.0",
    "deepgram-sdk>=3.7.0",
    "google-genai>=0.1.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
